<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEM BESS 公式工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <p class="product">NEM BESS 公式工作台</p>
    <nav class="tabs" aria-label="分頁">
      <a href="#predispatch" data-tab="predispatch">預調度</a>
      <a href="#scenario" data-tab="scenario">情境評估</a>
    </nav>
  </header>
  <main>
    <section class="page-head" aria-labelledby="page-title">
      <h1 id="page-title"></h1>
      <p class="lede" id="page-lede"></p>
    </section>
    <section class="verdict-bar" aria-label="結論">
      <div class="verdict" id="verdict" aria-live="polite"></div>
      <span class="calc-status" id="calc-status" role="status" aria-live="polite"></span>
    </section>
    <section class="chart-section" id="chart-section" aria-labelledby="chart-title">
      <div class="section-head">
        <h2 id="chart-title">電價與充放電排程</h2>
        <div class="data-bar" id="data-bar" aria-live="polite"></div>
      </div>
      <div class="chart-panel" id="price-chart"></div>
    </section>
    <section class="formula-section" aria-labelledby="formula-title">
      <div class="section-head">
        <h2 id="formula-title">公式</h2>
        <p class="cat-legend" aria-label="框框顏色">
          <span class="chip cat-price">電價</span><span class="chip cat-battery">設備</span><span class="chip cat-rule">判斷與彙總</span><span class="chip cat-scenario">情境假設</span><span class="chip cat-custom">你新增的</span><span class="chip cat-result">計算結果</span>
        </p>
        <button type="button" id="reset-all">全部還原預設</button>
      </div>
      <div class="formulas" id="formula-list"></div>
    </section>
    <section class="history" id="history-panel" aria-label="價差標準檢討" hidden></section>
  </main>
  <footer class="site-footer">
    <p>NSW1 · 市場時間 UTC+10（台北時間＝市場時間 − 2 小時）· 時段標記沿用 AEMO 慣例（時段結束時間）· 資料來源：AEMO NEM 資料儀表板 30 分鐘電價（公開資料）</p>
  </footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
